# Mosquitto para os testes da AAS do CR3, sem nada do hub do laboratório.
#
# O serviço "mosquitto" instalado pelo winget já atende esta máquina (só 127.0.0.1:1883).
# Use este arquivo quando outro equipamento (Raspberry Pi, PC ligado ao CR3) precisar
# acessar o broker pela rede. Veja o README (seção "Broker para a rede").

listener 1883
# Rede do laboratório, sem senha: só para testes. Não exponha esta porta fora da rede local.
allow_anonymous true
persistence false

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
